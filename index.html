  }else{

}

player.quaternion.normalize();player.userData.prop.rotation.z+=dt*35;const previousPosition=player.position.clone();forward.set(0,0,-1).applyQuaternion(player.quaternion);player.position.addScaledVector(forward,speed*dt);updateAmmoPanel(dt,previousPosition);updateTwinPanel(dt,previousPosition);updateStickyPanel(dt,previousPosition);}else tickPlayerCrash(dt);if(!playerCrash.active){

 }if(Math.abs(player.position.x)>550||Math.abs(player.position.z)>550)player.position.multiplyScalar(1-.08*dt);shot-=dt;if(!playerCrash.active&&(keys.Space||fireHeld||autoFire)&&shot<=0){

}else e.cooldown=.15}}
