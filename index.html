<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Air Brawl Clone</title><style>
html,body{margin:0;overflow:hidden;background:#77cfff;font-family:system-ui;color:white;touch-action:none}
#hud{position:fixed;top:12px;left:14px;text-shadow:1px 2px 3px #123;pointer-events:none}
#help{position:fixed;bottom:12px;left:12px;background:#1238;padding:9px;border-radius:8px;font-size:12px}
#mobile{position:fixed;inset:0;pointer-events:none}
button{pointer-events:auto;border:1px solid #fff8;background:#2349;color:white;border-radius:12px;font-size:20px;touch-action:none}
#pad{position:absolute;bottom:20px;right:20px;display:grid;grid-template-columns:repeat(3,55px);gap:5px}
#pad button{height:55px}
#fire{position:absolute;bottom:95px;left:20px;width:85px;height:85px;border-radius:50%;background:#d43655bb}
#throttle{position:absolute;bottom:20px;left:115px;display:flex;gap:6px}
#throttle button{width:52px;height:52px}
@media(pointer:fine){#mobile{display:none}}@media(pointer:coarse){#help{display:none}}
/* Prevent Android text selection, long-press callouts, and dragging for every current/future game button. */
html,body,button,[role="button"],#mobile,#mobile *{
 -webkit-user-select:none!important;user-select:none!important;
 -webkit-touch-callout:none!important;-webkit-tap-highlight-color:transparent;
}
button,[role="button"]{touch-action:none;-webkit-user-drag:none}
::selection{background:transparent}
</style></head><body><div id="hud"><b>AIR BRAWL</b><div id="stats"></div></div><div id="help">W/S throttle · Arrows steer & climb · A/D roll · Space fire · R respawn</div><div id="mobile"><button id="fire" data-key="Space">FIRE</button><div id="throttle"><button data-key="KeyW">+</button><button data-key="KeyS">−</button></div><div id="pad"><span></span><button data-key="ArrowUp">▲</button><span></span><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x73c9f7);scene.fog=new THREE.Fog(0x73c9f7,180,650);const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,1200);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x63834e,2.3));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(100,180,70);scene.add(sun);
const mat=c=>new THREE.MeshLambertMaterial({color:c});const white=mat(0xf7f2dd),red=mat(0xc94d49),dark=mat(0x263744),blue=mat(0x4b8ac4),green=mat(0x80b84e),brown=mat(0x775343),gold=mat(0xffde6a);
function box(parent,w,h,d,m,x=0,y=0,z=0){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);parent.add(o);return o}function plane(color){const g=new THREE.Group();box(g,1.2,.75,5.2,color);box(g,9,.22,1.45,color,0,0,.15);box(g,3.5,.18,1.1,color,0,.2,2);box(g,.22,1.6,1,color,0,.9,2);box(g,.8,.45,1.3,dark,0,.45,-.7);let prop=box(g,3,.15,.12,dark,0,0,-2.85);g.userData.prop=prop;return g}
const ground=box(scene,1200,2,1200,green,0,-3,0);let water=box(scene,90,.15,1200,blue,0,-1.9,0);for(let i=0;i<95;i++){let x=(Math.random()-.5)*500,z=(Math.random()-.5)*500;if(Math.abs(x)<52)continue;let h=6+Math.random()*22;box(scene,6+Math.random()*10,h,6+Math.random()*10,white,x,h/2-2,z);box(scene,7,.7,8,brown,x,h-1.7,z)}for(let i=0;i<110;i++){let x=(Math.random()-.5)*550,z=(Math.random()-.5)*550;if(Math.abs(x)<65)continue;box(scene,.7,4,.7,brown,x,0,z);let crown=new THREE.Mesh(new THREE.IcosahedronGeometry(3.2,0),green);crown.position.set(x,5,z);scene.add(crown)}
const player=plane(red);scene.add(player);let speed=28,hp=100,kills=0;function reset(){player.position.set(0,24,75);player.rotation.set(0,Math.PI,0);speed=28;hp=100}reset();const enemies=[];for(let i=0;i<7;i++){let p=plane(i%2?dark:gold);p.position.set((Math.random()-.5)*240,18+Math.random()*65,(Math.random()-.5)*240);scene.add(p);enemies.push({mesh:p,hp:3,phase:Math.random()*6.28,cooldown:Math.random()*3})}const bullets=[];const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='KeyR')reset()});addEventListener('keyup',e=>keys[e.code]=false);
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[k]=false)});
/* Capture phase also protects controls added in later versions. */
document.addEventListener('contextmenu',e=>{if(e.target.closest('button,[role="button"],#mobile'))e.preventDefault()},true);
document.addEventListener('selectstart',e=>{if(e.target.closest('button,[role="button"],#mobile'))e.preventDefault()},true);
document.addEventListener('dragstart',e=>{if(e.target.closest('button,[role="button"],#mobile'))e.preventDefault()},true);
document.addEventListener('touchstart',e=>{if(e.target.closest('button,[role="button"],#mobile'))e.preventDefault()},{passive:false,capture:true});
let shot=0;const clock=new THREE.Clock();function shoot(origin,dir,hostile=false){let mesh=new THREE.Mesh(new THREE.SphereGeometry(.22,6,6),hostile?red:gold);mesh.position.copy(origin);scene.add(mesh);bullets.push({mesh,velocity:dir.multiplyScalar(140),life:2.5,hostile})}
function update(dt,t){if(keys.KeyW)speed=Math.min(65,speed+25*dt);if(keys.KeyS)speed=Math.max(12,speed-25*dt);const turn=(Number(!!keys.ArrowLeft)-Number(!!keys.ArrowRight))*1.25;const pitch=(Number(!!keys.ArrowDown)-Number(!!keys.ArrowUp))*.9;player.rotateY(turn*dt);player.rotateX(pitch*dt);player.rotateZ((Number(!!keys.KeyA)-Number(!!keys.KeyD))*.9*dt);player.rotation.z*=Math.max(0,1-dt*.45);player.userData.prop.rotation.z+=dt*35;let forward=new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);player.position.addScaledVector(forward,speed*dt);if(player.position.y<2){hp-=40*dt;player.position.y=2}if(Math.abs(player.position.x)>550||Math.abs(player.position.z)>550)player.position.multiplyScalar(1-.08*dt);shot-=dt;if(keys.Space&&shot<=0){shoot(player.localToWorld(new THREE.Vector3(0,0,-3)),forward.clone());shot=.13}
for(const e of enemies){const p=e.mesh;e.phase+=dt*.5;p.rotation.y+=dt*(.24+Math.sin(e.phase)*.2);p.rotation.x=Math.sin(e.phase*.8)*.15;p.userData.prop.rotation.z+=dt*25;const f=new THREE.Vector3(0,0,-1).applyQuaternion(p.quaternion);p.position.addScaledVector(f,dt*22);p.position.y+=Math.sin(e.phase)*dt*3;if(p.position.y<12)p.position.y=12;if(p.position.distanceTo(player.position)>290){p.position.copy(player.position).add(new THREE.Vector3((Math.random()-.5)*180,20,(Math.random()-.5)*180))}e.cooldown-=dt;if(e.cooldown<0&&p.position.distanceTo(player.position)<110){const d=player.position.clone().sub(p.position).normalize();shoot(p.position.clone(),d,true);e.cooldown=1.7+Math.random()*2}}
for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.mesh.position.addScaledVector(b.velocity,dt);b.life-=dt;let hit=false;if(b.hostile){if(b.mesh.position.distanceTo(player.position)<3){hp-=12;hit=true}}else{for(const e of enemies){if(b.mesh.position.distanceTo(e.mesh.position)<4){e.hp--;hit=true;if(e.hp<=0){kills++;e.hp=3;e.mesh.position.copy(player.position).add(new THREE.Vector3((Math.random()-.5)*180,25,(Math.random()-.5)*180))}break}}}if(hit||b.life<=0){scene.remove(b.mesh);b.mesh.geometry.dispose();bullets.splice(i,1)}}if(hp<=0)reset();const desired=player.localToWorld(new THREE.Vector3(0,6,19));camera.position.lerp(desired,Math.min(1,dt*4));const look=player.localToWorld(new THREE.Vector3(0,1,-24));camera.lookAt(look);document.getElementById('stats').textContent=`HP ${Math.max(0,Math.round(hp))}  |  Speed ${Math.round(speed)}  |  Kills ${kills}  |  Alt ${Math.round(player.position.y)}`}
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);update(dt,clock.elapsedTime);renderer.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
